name: Build Windows

permissions:
  actions: write
  contents: write

on:
  push:
    branches: [ master, test-ci, feature/python ]
  pull_request:
    branches: [ master, feature/python ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build: Windows ${{ matrix.arch }}-${{ matrix.config }}"
    runs-on: ${{ matrix.os }}
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      SCCACHE_GHA_ENABLED: "true"

    strategy:
      fail-fast: false
      matrix:
        arch: [x64,arm64]
        config: [Release]
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    steps:
    - name: Remove Perl Strawberry installation
      # Removes conflicting headers from include paths
      run: |
        Remove-Item -Recurse -Force C:/Strawberry -ErrorAction SilentlyContinue

    - name: Checkout Git Repo
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Configure MSVC environment
      uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0 (includes dist/index.js)
      with:
        arch: ${{ matrix.arch }}

    - name: Install latest CMake
      uses: lukka/get-cmake@628dd514bed37cb0a609e84a6186cbbaa2fc0140 # latest as of 2025-10-04

    - name: Cache CPM sources
      uses: actions/cache@v6
      with:
        path: ${{ env.CPM_SOURCE_CACHE }}
        key: ${{ runner.os }}-${{ matrix.arch }}-cpm-${{ hashFiles('gui/qt/cmake/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch }}-cpm-

    - name: Cache built Qt
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/gui/qt/CEmu.build/cpm/Win-${{ matrix.arch }}/_deps
        key: ${{ runner.os }}-${{ matrix.arch }}-qt-${{ hashFiles('gui/qt/CMakeLists.txt', 'gui/qt/CMakePresets.json', 'gui/qt/cmake/**') }}
        # The Qt install prefix validates its own toolchain/configuration hash.
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch }}-qt-

    - name: Start sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Configure CEmu ${{ matrix.config }}
      working-directory: gui/qt
      shell: pwsh
      run: cmake --preset "Win-${{ matrix.arch }}" "-DSHORT_VERSION=v3.0" "-DCMAKE_C_COMPILER_LAUNCHER=sccache" "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"

    - name: Build CEmu ${{ matrix.config }}
      working-directory: gui/qt
      shell: pwsh
      run: cmake --build --preset "Win-${{ matrix.arch }}-${{ matrix.config }}" --parallel

    - name: Upload ${{ matrix.arch }} ${{ matrix.config }} EXE
      uses: actions/upload-artifact@v7
      with:
        name: CEmu_win-${{ matrix.arch }}_master
        path: ${{ github.workspace }}/gui/qt/CEmu.build/cpm/Win-${{ matrix.arch }}/${{ matrix.config }}/CEmu.exe

    - name: Prepare binary for release upload
      shell: pwsh
      if: ${{ matrix.config == 'Release' }}
      run: |
        $ReleaseName = "CEmu-nightly_win-${{ matrix.arch }}-msvc.exe"
        Rename-Item -Path "${{ github.workspace }}/gui/qt/CEmu.build/cpm/Win-${{ matrix.arch }}/${{ matrix.config }}/CEmu.exe" -NewName $ReleaseName
        echo "RELEASE_NAME=$ReleaseName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Update nightly release
      if: ${{ matrix.config == 'Release' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
      uses: softprops/action-gh-release@6680cc089e59314c4460b839412c25fb6a71ce3b # latest as of 2026-10-31
      with:
        tag_name: nightly
        prerelease: true
        token: ${{secrets.GITHUB_TOKEN}}
        files: |
          ./gui/qt/CEmu.build/cpm/Win-${{ matrix.arch }}/${{ matrix.config }}/${{ env.RELEASE_NAME }}
