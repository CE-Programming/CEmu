name: Build Linux

permissions:
  actions: write
  contents: write

on:
  push:
    branches: [ master, test-ci, feature/python ]
  pull_request:
    branches: [ master, feature/python ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-core-sdl:
    name: "Build: standalone core and SDL"
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
    - name: Checkout Git Repo
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential libsdl2-dev

    - name: Build standalone core
      run: make -C core -j"$(nproc)"

    - name: Build SDL frontend
      run: make -C gui/sdl -j"$(nproc)" CC=gcc

  build:
    name: "Build: ${{ matrix.os }} - ${{ matrix.archvariant }}"
    runs-on: ${{ matrix.os }}
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        arch: [x64]
        config: [Release]
        statictype: [ON, OFF]
        include:
          - statictype: ON
            archvariant: "x64"
            release_suffix: static
          - statictype: OFF
            archvariant: "x64-Dynamic"
            release_suffix: shared

    steps:
    - name: Checkout Git Repo
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: workaround for default apt mirror connectivity issues
      run: |
        sudo sed -i 's/azure\.//' /etc/apt/sources.list

    - name: Install dependencies
      run: |
        set -e
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ninja-build pkg-config perl libdbus-1-dev libfontconfig1-dev libfreetype6-dev libxcb-cursor-dev '^libxcb.*-dev' libx11-xcb-dev libglu1-mesa-dev libxrender-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1-mesa-dev libudev-dev libusb-1.0-0-dev

    - name: Install latest CMake
      uses: lukka/get-cmake@628dd514bed37cb0a609e84a6186cbbaa2fc0140 # latest as of 2025-10-04

    - name: Cache CPM sources
      uses: actions/cache@v4
      with:
        path: ${{ env.CPM_SOURCE_CACHE }}
        key: ${{ runner.os }}-${{ matrix.archvariant }}-cpm-${{ hashFiles('gui/qt/cmake/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.archvariant }}-cpm-

    - name: Cache built Qt
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/gui/qt/CEmu.build/cpm/Linux-${{ matrix.archvariant }}/_deps
        key: ${{ runner.os }}-${{ matrix.archvariant }}-qt-${{ hashFiles('gui/qt/CMakeLists.txt', 'gui/qt/CMakePresets.json', 'gui/qt/cmake/**') }}

    - name: Start sccache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Build CEmu ${{ matrix.archvariant }} ${{ matrix.config }} on Linux ${{ matrix.arch }}
      uses: lukka/run-cmake@67c73a83a46f86c4e0b96b741ac37ff495478c38 # latest as of 2025-10-04
      with:
        cmakeListsTxtPath: '${{ github.workspace }}/gui/qt/CMakeLists.txt'
        configurePreset: 'Linux-${{ matrix.archvariant }}'
        configurePresetAdditionalArgs: "['-DSHORT_VERSION=v3.0', '-DCMAKE_C_COMPILER_LAUNCHER=sccache', '-DCMAKE_CXX_COMPILER_LAUNCHER=sccache']"
        buildPreset: 'Linux-${{ matrix.archvariant }}-${{ matrix.config }}'

    - name: Upload binary as artifact
      uses: actions/upload-artifact@v7
      with:
        name: CEmu_linux_${{ matrix.archvariant }}_master
        path: ${{ github.workspace }}/gui/qt/CEmu.build/cpm/Linux-${{ matrix.archvariant }}/${{ matrix.config }}/CEmu

    - name: Prepare binary for release upload
      run: |
        mv ${{ github.workspace }}/gui/qt/CEmu.build/cpm/Linux-${{ matrix.archvariant }}/${{ matrix.config }}/CEmu ${{ github.workspace }}/CEmu-nightly_linux64_${{ matrix.release_suffix }}

    - name: Update nightly release
      if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
      uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # latest as of 2025-10-04
      with:
        tag_name: nightly
        prerelease: true
        token: ${{secrets.GITHUB_TOKEN}}
        files: |
          ${{ github.workspace }}/CEmu-nightly_linux64_${{ matrix.release_suffix }}
